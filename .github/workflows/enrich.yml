name: Enriquecimiento de empresas

# Lee las webs de las empresas, las analiza con IA y puntúa su encaje con el perfil.
# Cada noche avanza un lote (hasta 150 webs; el nivel gratuito de la IA es lento) y
# a demanda desde la app: "Analizar webs y puntuar" (mode=all) o "Solo recalcular el
# encaje" (mode=score, tras cambiar el perfil; no vuelve a leer las webs).
on:
  schedule:
    - cron: "30 3 * * *"
      timezone: Europe/Madrid
  workflow_dispatch:
    inputs:
      job_id:
        description: "Id del JobRun creado por la app (vacío si se lanza a mano)"
        required: false
        default: ""
      mode:
        description: "all = rastrear + analizar + puntuar · score = solo puntuar"
        required: false
        default: "all"
        type: choice
        options: [all, score]
      limit:
        description: "Máximo de webs a rastrear"
        required: false
        default: "150"

run-name: "enrich ${{ inputs.mode || 'all' }} [job ${{ inputs.job_id || 'cron' }}]"

permissions:
  contents: read

# Grupo propio: no bloquea al descubrimiento (que es corto) y nunca hay dos a la vez.
concurrency:
  group: enrich
  cancel-in-progress: false

jobs:
  enrich:
    name: enrich
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ALLOWED_HOSTS: localhost
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      # El nivel gratuito tarda a veces más de 90 s por llamada; aquí no hay un usuario esperando.
      LLM_TIMEOUT: "150"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev --group worker
      - name: Enriquecer empresas
        # Los inputs van por env y se validan: interpolarlos en el script permitiría inyectar órdenes.
        env:
          MODE: ${{ inputs.mode || 'all' }}
          LIMIT: ${{ inputs.limit || '150' }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          [[ "$MODE" =~ ^(all|score)$ ]] || { echo "mode no válido" >&2; exit 1; }
          [[ "$LIMIT" =~ ^[0-9]+$ ]] || { echo "limit no válido" >&2; exit 1; }
          args=(--mode "$MODE" --limit "$LIMIT" --max-minutes 45)
          if [[ -n "$JOB_ID" ]]; then
            [[ "$JOB_ID" =~ ^[0-9]+$ ]] || { echo "job_id no válido" >&2; exit 1; }
            args+=(--job-id "$JOB_ID")
          fi
          uv run python manage.py enrich "${args[@]}"
