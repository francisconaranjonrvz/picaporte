name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests (pytest + Postgres 17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: picaporte
          POSTGRES_PASSWORD: picaporte
          POSTGRES_DB: picaporte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Misma versión mayor que Neon; sin SSL porque el contenedor no lo trae.
      TEST_DATABASE_URL: postgres://picaporte:picaporte@localhost:5432/picaporte_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - name: Migraciones al día
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Tests con cobertura
        run: uv run pytest --create-db --cov=apps --cov=config --cov-report=term-missing

  deploy-check:
    name: Comprobaciones de despliegue
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ci-only-secret-key-0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJ
      DATABASE_URL: sqlite:///ci.sqlite3
      ALLOWED_HOSTS: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --no-dev
      - name: check --deploy (settings de producción)
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: collectstatic con storage manifest (como en el build de Vercel)
        run: uv run python manage.py collectstatic --noinput

  css:
    name: CSS compilado al día
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .tools
          key: tailwind-4.3.3-linux-x64
      - name: Recompilar Tailwind y comparar con static/css/app.css
        run: |
          python3 scripts/tw.py build
          git diff --stat --exit-code -- static/css/app.css

  docker:
    name: Docker (desarrollo local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construir y arrancar web + Postgres
        run: docker compose up --build --detach --wait
      - name: /health responde y ve la base de datos
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health | tee health.json | grep -q '"db": "ok"'; then exit 0; fi
            sleep 2
          done
          cat health.json || true
          docker compose logs web
          exit 1
      - name: Tests dentro del contenedor contra Postgres 17
        run: docker compose run --rm web pytest -q -p no:cacheprovider --create-db
      - name: Parar
        if: always()
        run: docker compose down --volumes
