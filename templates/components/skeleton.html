{% comment %}Skeleton loader. Uso: {% include "components/skeleton.html" with variant="card" %} (card | lines){% endcomment %}
{% if variant == "card" %}
<div class="card space-y-3" aria-hidden="true">
  <div class="flex items-center gap-3">
    <div class="skeleton size-11 rounded-full"></div>
    <div class="flex-1 space-y-2"><div class="skeleton h-4 w-2/3"></div><div class="skeleton h-3 w-1/2"></div></div>
  </div>
  <div class="skeleton h-3 w-full"></div>
  <div class="skeleton h-3 w-5/6"></div>
  <div class="flex gap-2 pt-1"><div class="skeleton h-9 w-24 rounded-2xl"></div><div class="skeleton h-9 w-9 rounded-2xl"></div></div>
</div>
{% else %}
<div class="space-y-2" aria-hidden="true"><div class="skeleton h-4 w-3/4"></div><div class="skeleton h-4 w-1/2"></div><div class="skeleton h-4 w-2/3"></div></div>
{% endif %}
