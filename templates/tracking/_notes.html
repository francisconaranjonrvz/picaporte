<ul id="notes" class="mt-3 space-y-2">
  {% for note in notes %}
  <li class="text-sm {% if note.is_status_change %}text-muted{% endif %}">
    <span class="block text-xs text-muted">{{ note.created_at|date:"j M Y, H:i" }}</span>
    {{ note.text|linebreaksbr }}
  </li>
  {% empty %}
  <li class="text-sm text-muted">Aún no hay notas.</li>
  {% endfor %}
</ul>
