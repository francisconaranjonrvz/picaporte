{# Una tanda de tarjetas + el botón para la siguiente (se reemplaza a sí mismo al cargar más). #}
{% for company in companies %}{% include "companies/_company_card.html" %}{% endfor %}
{% if next_after %}
<li id="load-more" class="pt-1">
  <button type="button" class="chip mx-auto flex min-h-11 justify-center px-5"
          hx-get="{% url 'explorar' %}?{% if query %}{{ query }}&{% endif %}after={{ next_after }}"
          hx-target="#load-more" hx-swap="outerHTML" hx-indicator="#load-more">
    Cargar más
  </button>
  <div class="htmx-indicator mt-3 space-y-3" aria-hidden="true"><div class="skeleton h-24"></div><div class="skeleton h-24"></div></div>
</li>
{% endif %}
